name: Publish npm package

on:
  push:
    tags:
      - 'dsh-memorybear@v*'
      - 'dsh-memoryskills@v*'
      - 'dsh-memory-core@v*'
  workflow_dispatch:
    inputs:
      package:
        description: Workspace package to publish
        required: true
        type: choice
        options:
          - dsh-memorybear
          - dsh-memoryskills
          - dsh-memory-core

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Resolve package and dist-tag
        id: target
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_PACKAGE: ${{ inputs.package }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_PACKAGE:-}" ]; then
            pkg="$INPUT_PACKAGE"
            tag_version=""
          else
            pkg="${REF_NAME%@v*}"
            tag_version="${REF_NAME##*@v}"
          fi
          case "$pkg" in
            dsh-memorybear|dsh-memoryskills|dsh-memory-core) ;;
            *) echo "unsupported package: $pkg" >&2; exit 1 ;;
          esac
          manifest="packages/$pkg/package.json"
          name=$(node -p "require('./$manifest').name")
          version=$(node -p "require('./$manifest').version")
          if [ -n "$tag_version" ] && [ "$tag_version" != "$version" ]; then
            echo "tag version '$tag_version' does not match $manifest version '$version'" >&2
            exit 1
          fi
          case "$version" in
            *-*) dist_tag=next ;;
            *) dist_tag=latest ;;
          esac
          {
            echo "name=$name"
            echo "version=$version"
            echo "dist_tag=$dist_tag"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing $name@$version (dist-tag: $dist_tag)"

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          pnpm --filter "${{ steps.target.outputs.name }}" publish \
            --access public \
            --tag "${{ steps.target.outputs.dist_tag }}" \
            --provenance \
            --no-git-checks

      - name: Job summary
        run: |
          {
            echo "### Published \`${{ steps.target.outputs.name }}@${{ steps.target.outputs.version }}\`"
            echo ""
            echo "dist-tag: \`${{ steps.target.outputs.dist_tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
