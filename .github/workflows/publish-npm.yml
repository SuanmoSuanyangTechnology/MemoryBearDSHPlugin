name: Publish npm package

# Trusted publishing (OIDC) with staged publishing: no NPM_TOKEN secret is used.
# Configure each package on npmjs.com under Settings -> Trusted Publisher ->
# GitHub Actions:
#   organization/user: SuanmoSuanyangTechnology
#   repository:        MemoryBearDSHPlugin
#   workflow filename: publish-npm.yml
# Leave "Publish directly" unchecked; staged publish is always allowed.
# A maintainer must approve each staged version before it becomes public.
on:
  push:
    tags:
      - 'dsh-memorybear@v*'
      - 'dsh-memoryskills@v*'
      - 'dsh-memory-core@v*'
  workflow_dispatch:
    inputs:
      package:
        description: Workspace package to stage
        required: true
        type: choice
        options:
          - dsh-memorybear
          - dsh-memoryskills
          - dsh-memory-core

permissions:
  contents: read
  id-token: write # OIDC token for npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Resolve package and dist-tag
        id: target
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_PACKAGE: ${{ inputs.package }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_PACKAGE:-}" ]; then
            pkg="$INPUT_PACKAGE"
            tag_version=""
          else
            pkg="${REF_NAME%@v*}"
            tag_version="${REF_NAME##*@v}"
          fi
          case "$pkg" in
            dsh-memorybear|dsh-memoryskills|dsh-memory-core) ;;
            *) echo "unsupported package: $pkg" >&2; exit 1 ;;
          esac
          manifest="packages/$pkg/package.json"
          name=$(node -p "require('./$manifest').name")
          version=$(node -p "require('./$manifest').version")
          if [ -n "$tag_version" ] && [ "$tag_version" != "$version" ]; then
            echo "tag version '$tag_version' does not match $manifest version '$version'" >&2
            exit 1
          fi
          case "$version" in
            *-*) dist_tag=next ;;
            *) dist_tag=latest ;;
          esac
          {
            echo "name=$name"
            echo "version=$version"
            echo "dist_tag=$dist_tag"
          } >> "$GITHUB_OUTPUT"
          echo "Staging $name@$version (dist-tag: $dist_tag)"

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - name: Stage package for npm
        id: stage
        run: |
          pnpm --filter "${{ steps.target.outputs.name }}" stage publish \
            --registry=https://registry.npmjs.org \
            --access public \
            --tag "${{ steps.target.outputs.dist_tag }}" \
            --no-git-checks \
            --json > stage-result.json
          node - <<'NODE'
          const fs = require('node:fs')
          const raw = fs.readFileSync('stage-result.json', 'utf8').trim()
          let stageId = ''
          if (raw) {
            const data = JSON.parse(raw)
            const staged = Object.values(data)[0] ?? {}
            stageId = staged.stageId ?? ''
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `stage_id=${stageId}\n`)
          console.log(stageId ? `staged with id ${stageId}` : 'staged (no stage id in output)')
          NODE

      - name: Job summary
        run: |
          {
            echo "### Staged \`${{ steps.target.outputs.name }}@${{ steps.target.outputs.version }}\`"
            echo ""
            echo "dist-tag: \`${{ steps.target.outputs.dist_tag }}\`"
            echo ""
            if [ -n "${{ steps.stage.outputs.stage_id }}" ]; then
              echo "stage id: \`${{ steps.stage.outputs.stage_id }}\`"
              echo ""
            fi
            echo "Approve it on npmjs.com or with \`pnpm stage approve <stage-id>\`; nothing is public until then."
          } >> "$GITHUB_STEP_SUMMARY"
